<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body { background:#f8f8f6; color:#12151a;
         font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; position:relative; }
  .mono { font-family:"IBM Plex Mono", ui-monospace, monospace; }
  .plate { position:absolute; top:0; right:0; width:520px; height:630px;
           background:#ffffff; border-left:1px solid #dfe0dc; overflow:hidden; }
  .plate img { position:absolute; top:-20px; left:30px; width:670px; height:670px; }
  .left { position:absolute; inset:0; width:700px; padding:56px 0 48px 64px;
          display:flex; flex-direction:column; justify-content:space-between; z-index:2; }
  .kicker { font-size:12px; letter-spacing:0.16em; color:#70746f; text-transform:uppercase; }
  .spec { display:flex; align-items:center; gap:22px; margin-top:26px; }
  .term { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .val { font-size:78px; line-height:1; letter-spacing:-0.02em; }
  .lab { font-size:12px; letter-spacing:0.1em; color:#70746f; }
  .verdict { display:flex; align-items:center; gap:12px; margin-top:26px; font-size:20px; }
  .rule { width:56px; height:2px; background:#1f4bff; margin-bottom:20px; }
  .foot { font-size:13px; color:#70746f; }
  .foot b { color:#12151a; font-weight:500; }
</style></head>
<body>
  <div class="plate"><img src="lattice.png" alt=""></div>
  <div class="left">
    <div>
      <div class="kicker mono">Reverse prime plot</div>
      <div class="spec">
        <div class="term"><span class="val mono">13</span><span class="lab mono">n</span></div>
        <svg width="46" height="16" viewBox="0 0 46 16" fill="none">
          <path d="M1 8h40" stroke="#12151a" stroke-width="1.4"/>
          <path d="M35 2l7 6-7 6" stroke="#12151a" stroke-width="1.4" fill="none"/>
        </svg>
        <div class="term"><span class="val mono">31</span><span class="lab mono">reverse(n)</span></div>
      </div>
      <div class="verdict">
        <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#12151a"/></svg>
        <span>Both are prime, so this point is drawn.</span>
      </div>
    </div>
    <div>
      <div class="rule"></div>
      <div class="foot mono">Built by <b>Babak Bandpey</b> · cocode.dk · linkedin.com/in/babakbandpey</div>
    </div>
  </div>
</body></html>
