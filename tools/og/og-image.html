<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body {
    background:#f4f0e7;
    font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    position:relative;
  }
  /* Paper on the left, card cream on the right — the same two grounds the app
     itself uses, so the card edge is a real boundary rather than decoration. */
  .plate { position:absolute; top:0; right:0; width:545px; height:630px;
           background:#fffdf8; overflow:hidden; }
  .plate img { position:absolute; top:0; left:22px; width:630px; height:630px; }
  .left { position:absolute; inset:0; width:700px;
          padding:62px 0 54px 74px; display:flex; flex-direction:column;
          justify-content:space-between; z-index:2; }
  .eyebrow { color:#d84b2b; font-size:15px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }
  h1 { font-family: Georgia, Cambria, "Times New Roman", serif;
       font-size:88px; font-weight:500; line-height:.9; letter-spacing:-.055em;
       color:#18332e; margin-top:24px; }
  .sub { color:#52645f; font-size:21px; line-height:1.5; margin-top:22px; max-width:430px; }
  .sub b { color:#18332e; font-weight:700; }
  .legend { display:flex; gap:22px; }
  .item { display:flex; align-items:center; gap:8px; color:#52645f; font-size:13.5px; font-weight:650; white-space:nowrap; }
  .foot { color:#687670; font-size:13.5px; font-weight:600; margin-top:20px; }
  .foot b { color:#18332e; }
  .rule { width:64px; height:3px; background:#f15a37; margin-bottom:26px; }
</style></head>
<body>
  <div class="plate"><img src="lattice.png" alt=""></div>
  <div class="left">
    <div>
      <div class="eyebrow">Number mirror · prime explorer</div>
      <h1>Reverse<br>Prime Plot</h1>
      <p class="sub">Every number <b>n</b> plotted against <b>reverse(n)</b> — up to ten million, marking which of the pair are prime.</p>
    </div>
    <div>
      <div class="rule"></div>
      <div class="legend">
        <div class="item"><svg width="19" height="19" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#fffdf8"/><path d="M 2 10 A 8 8 0 0 1 18 10 Z" fill="#f15a37"/><circle cx="10" cy="10" r="8" fill="none" stroke="#18332e" stroke-width="1.4"/></svg>n is prime</div>
        <div class="item"><svg width="19" height="19" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#fffdf8"/><path d="M 2 10 A 8 8 0 0 0 18 10 Z" fill="#f15a37"/><circle cx="10" cy="10" r="8" fill="none" stroke="#18332e" stroke-width="1.4"/></svg>reverse(n) is prime</div>
        <div class="item"><svg width="19" height="19" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#f15a37"/><circle cx="10" cy="10" r="8" fill="none" stroke="#18332e" stroke-width="1.4"/></svg>both</div>
      </div>
      <div class="foot">Built by <b>Babak Bandpey</b> · cocode.dk · linkedin.com/in/babakbandpey</div>
    </div>
  </div>
</body></html>
