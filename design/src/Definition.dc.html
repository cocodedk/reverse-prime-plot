<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1f4bff; } a:hover { color: #0f2ea8; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sans { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; }
  </style>
</helmet>

<div class="sans" style="width: 390px; height: 844px; background: #f8f8f6; color: #12151a; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 16px 18px 12px;">
    <span class="mono" style="font-size: 12px; letter-spacing: 0.02em;">reverse-prime-plot</span>
    <span class="mono" style="font-size: 11px; color: #70746f;">EN / فا</span>
  </div>

  <div style="margin: 0 18px; border: 1px solid #12151a; background: #ffffff;">
    <div style="padding: 14px 16px 12px; border-bottom: 1px solid #dfe0dc;">
      <span class="mono" style="font-size: 10px; letter-spacing: 0.16em; color: #70746f;">DEFINITION</span>
    </div>
    <div class="mono" style="display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; padding: 16px;">
      <span style="font-size: 14px; color: #70746f;">n</span>
      <span style="font-size: 14px;">any whole number</span>
      <span style="font-size: 14px; color: #70746f;">r</span>
      <span style="font-size: 14px;">its digits, reversed</span>
      <span style="font-size: 14px; color: #70746f;">plot</span>
      <span style="font-size: 14px;">the point (n, r)</span>
    </div>
    <div style="padding: 14px 16px; border-top: 1px solid #dfe0dc; background: #f4f4f1;">
      <div class="mono" style="display: flex; gap: 12px; align-items: baseline; font-size: 15px;">
        <span style="color: #70746f;">e.g.</span>
        <span>n = 13</span>
        <span style="color: #70746f;">→</span>
        <span>r = 31</span>
      </div>
      <div style="display: flex; gap: 8px; align-items: center; margin-top: 10px;">
        <svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="#12151a"/></svg>
        <span class="mono" style="font-size: 13px;">13 prime, 31 prime — drawn filled</span>
      </div>
    </div>
  </div>

  <div style="padding: 18px 18px 10px; display: flex; gap: 18px;">
    <div style="display: flex; gap: 7px; align-items: center;">
      <svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="#12151a" stroke-width="1.3"/><path d="M2 10a8 8 0 0116 0z" fill="#12151a"/></svg>
      <span class="mono" style="font-size: 11px; color: #4a4f4c;">n</span>
    </div>
    <div style="display: flex; gap: 7px; align-items: center;">
      <svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="#12151a" stroke-width="1.3"/><path d="M2 10a8 8 0 0016 0z" fill="#12151a"/></svg>
      <span class="mono" style="font-size: 11px; color: #4a4f4c;">r</span>
    </div>
    <div style="display: flex; gap: 7px; align-items: center;">
      <svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="#12151a"/></svg>
      <span class="mono" style="font-size: 11px; color: #4a4f4c;">both</span>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 4px 18px 0;">
    <svg width="354" height="360" viewBox="0 0 354 360" aria-hidden="true">
      <g stroke="#e4e5e2" stroke-width="1">
        <path d="M88.5 6v340M177.5 6v340M266.5 6v340M14 88.5h330M14 177.5h330M14 266.5h330"/>
      </g>
      <path d="M14 346h330M14 6v340" stroke="#12151a" stroke-width="1"/>
      <g fill="#12151a">
        <circle cx="48" cy="306" r="3.2"/><circle cx="66" cy="292" r="3.2"/><circle cx="100" cy="260" r="3.2"/>
        <circle cx="132" cy="208" r="3.2"/><circle cx="154" cy="184" r="3.2"/><circle cx="208" cy="138" r="3.2"/>
        <circle cx="246" cy="96" r="3.2"/><circle cx="290" cy="66" r="3.2"/><circle cx="314" cy="46" r="3.2"/>
        <circle cx="80" cy="236" r="3.2"/><circle cx="200" cy="248" r="3.2"/><circle cx="268" cy="172" r="3.2"/>
      </g>
      <g stroke="#12151a" stroke-width="1.2" fill="none">
        <circle cx="120" cy="272" r="4"/><circle cx="232" cy="200" r="4"/><circle cx="168" cy="132" r="4"/>
      </g>
      <g fill="#12151a">
        <path d="M116 272a4 4 0 018 0z"/><path d="M228 200a4 4 0 000 0 4 4 0 008 0z"/><path d="M164 132a4 4 0 018 0z"/>
      </g>
      <text class="mono" x="14" y="358" font-size="9" fill="#70746f">0</text>
      <text class="mono" x="330" y="358" font-size="9" fill="#70746f">100</text>
    </svg>
  </div>

  <div style="display: flex; gap: 8px; padding: 10px 18px 18px; border-top: 1px solid #dfe0dc; align-items: center;">
    <span class="mono" style="font-size: 11px; color: #70746f;">0–100</span>
    <div style="flex-grow: 1;"></div>
    <button class="mono" style="height: 44px; padding: 0 14px; font-size: 12px; border: 1px solid #c9cbc7; background: #ffffff; color: #12151a;">EDIT RANGE</button>
    <button class="mono" style="height: 44px; padding: 0 16px; font-size: 12px; border: 0; background: #1f4bff; color: #ffffff;">PLOT</button>
  </div>

</div>
</x-dc>
</body>
</html>
