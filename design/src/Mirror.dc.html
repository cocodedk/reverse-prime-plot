<!doctype html>
<html>

<x-dc>
<helmet>

  <style>
    body { margin: 0; }
    a { color: #1f4bff; } a:hover { color: #0f2ea8; }

    .sans { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; }

<div class="sans" style="width: 390px; height: 844px; background: #12151a; color: #f2f3f0; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px 18px; border-bottom: 1px solid #262b30;">
    <span class="mono" style="font-size: 11px; letter-spacing: 0.14em; color: #8c928d;">N &nbsp;/&nbsp; REVERSE(N)</span>
    <span class="mono" style="font-size: 11px; color: #8c928d;">EN / فا</span>
  </div>

  <div style="padding: 30px 18px 24px; display: flex; flex-direction: column; align-items: center; gap: 0;">
    <span class="mono" style="font-size: 54px; line-height: 1; letter-spacing: -0.02em;">1913</span>
    <div style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 0;">
      <div style="flex-grow: 1; height: 1px; background: #3a4046;"></div>
      <span class="mono" style="font-size: 9px; letter-spacing: 0.18em; color: #8c928d;">MIRROR</span>
      <div style="flex-grow: 1; height: 1px; background: #3a4046;"></div>
    </div>
    <span class="mono" style="font-size: 54px; line-height: 1; letter-spacing: -0.02em; color: #7de2c3;">3191</span>
    <p class="sans" style="margin: 20px 0 0; font-size: 14px; line-height: 1.5; color: #b6bcb7; text-align: center;">
      Both are prime. Every such pair becomes one point.
    </p>
  </div>

  <div style="flex-grow: 1; padding: 0 18px; display: flex; align-items: flex-start; justify-content: center;">
    <svg width="354" height="330" viewBox="0 0 354 330" aria-hidden="true">
      <rect x="0.5" y="0.5" width="353" height="329" fill="#171b21" stroke="#262b30"/>
      <path d="M0 330L354 0" stroke="#3a4046" stroke-width="1" stroke-dasharray="3 4"/>
      <g fill="#7de2c3">
        <circle cx="44" cy="288" r="3"/><circle cx="70" cy="266" r="3"/><circle cx="104" cy="238" r="3"/>
        <circle cx="140" cy="192" r="3"/><circle cx="176" cy="164" r="3"/><circle cx="212" cy="128" r="3"/>
        <circle cx="252" cy="92" r="3"/><circle cx="288" cy="62" r="3"/><circle cx="316" cy="38" r="3"/>
      </g>
      <g fill="#f2f3f0">
        <circle cx="88" cy="196" r="2.6"/><circle cx="196" cy="240" r="2.6"/><circle cx="268" cy="172" r="2.6"/>
        <circle cx="124" cy="112" r="2.6"/><circle cx="308" cy="216" r="2.6"/>
      </g>
      <text class="mono" x="10" y="322" font-size="9" fill="#8c928d">0</text>
      <text class="mono" x="322" y="16" font-size="9" fill="#8c928d">n</text>
    </svg>
  </div>

  <div style="display: flex; gap: 20px; padding: 14px 18px; border-top: 1px solid #262b30;">
    <div><span class="mono" style="font-size: 16px;">167</span><span class="mono" style="font-size: 10px; color: #8c928d;"> pairs</span></div>
    <div><span class="mono" style="font-size: 16px; color: #7de2c3;">29</span><span class="mono" style="font-size: 10px; color: #8c928d;"> chained</span></div>
  </div>

  <div style="display: flex; gap: 8px; padding: 12px 18px 18px; border-top: 1px solid #262b30; align-items: center;">
    <input class="mono" value="0" style="flex-grow: 1; min-width: 0; height: 44px; padding: 0 10px; font-size: 15px; border: 1px solid #3a4046; background: #171b21; color: #f2f3f0;">
    <input class="mono" value="5000" style="flex-grow: 1; min-width: 0; height: 44px; padding: 0 10px; font-size: 15px; border: 1px solid #3a4046; background: #171b21; color: #f2f3f0;">
    <button class="mono" style="height: 44px; padding: 0 16px; font-size: 12px; letter-spacing: 0.08em; border: 0; background: #7de2c3; color: #12151a;">PLOT</button>
  </div>

</div>

</html>
